name: Test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - run: npm ci
      - run: npm test
      - name: Package the tested tag and exact dependency lock
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne "v$($package.version)") { throw 'Tag must match package.json version' }
          New-Item -ItemType Directory -Path release | Out-Null
          $packed = npm pack --json --pack-destination release | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'npm pack failed' }
          Copy-Item -LiteralPath package-lock.json -Destination release/package-lock.json
          $files = @($packed[0].filename, 'package-lock.json')
          $sums = foreach ($file in $files) { "$((Get-FileHash -LiteralPath (Join-Path release $file) -Algorithm SHA256).Hash.ToLowerInvariant())  $file" }
          [IO.File]::WriteAllText((Join-Path $PWD release/SHA256SUMS), ($sums -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-files
          path: |
            release/*.tgz
            release/package-lock.json
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-files
          path: release
      - name: Publish prerelease with the three reviewed asset types
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          @'
          import { readFile } from 'node:fs/promises';
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'WhatIveDone-release' };
          const base = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/releases`;
          async function request(url, method, body, contentType = 'application/json') {
            const response = await fetch(url, { method, headers: { ...headers, 'Content-Type': contentType }, body });
            if (!response.ok) throw new Error(`GitHub release request failed (${response.status})`);
            return response.json();
          }
          const tag = process.env.RELEASE_TAG;
          const files = [`whativedone-${tag.slice(1)}.tgz`, 'package-lock.json', 'SHA256SUMS'];
          const assets = await Promise.all(files.map(async name => ({ name, bytes: await readFile(`release/${name}`) })));
          const release = await request(base, 'POST', JSON.stringify({ tag_name: tag, name: tag, draft: true, prerelease: true, body: 'Windows preview. See README for installation and PRIVACY.md for data boundaries. Verify the package and exact dependency lock against SHA256SUMS.' }));
          for (const { name, bytes } of assets) {
            const url = release.upload_url.replace(/\{.*$/, '') + `?name=${encodeURIComponent(name)}`;
            await request(url, 'POST', bytes, 'application/octet-stream');
          }
          const published = await request(`${base}/${release.id}`, 'PATCH', JSON.stringify({ draft: false }));
          console.log(published.html_url);
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
